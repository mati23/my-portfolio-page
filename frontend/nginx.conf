server {
    listen 4173;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://flowbite.com https://s3-us-west-2.amazonaws.com; connect-src 'self' https://s3-us-west-2.amazonaws.com; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location ~ /\. { return 404; }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location /resources/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
