name: Security and regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.19.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
      - name: Install Gitleaks with checksum verification
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks_8.30.1_linux_x64.tar.gz gitleaks_8.30.1_checksums.txt
      - run: bash scripts/check-security.sh
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run test:unit
      - run: dotnet restore tests/Backend.Errors/Backend.Errors.csproj --locked-mode
      - run: dotnet run --no-restore --project tests/Backend.Errors/Backend.Errors.csproj
      - run: python3 scripts/test-backend.py
      - name: Compose integration
        env:
          COMPOSE_TEST_REPORT: security-reports/compose.json
        run: python3 scripts/test-compose.py
      - name: Browser regression on production image
        run: |
          docker run -d --name portfolio-web -p 127.0.0.1:4173:4173 portfolio-frontend:security
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            frontend/test-results/
            security-reports/npm*.json
            security-reports/nuget.json
            security-reports/portfolio-*.json
            security-reports/compose.json
      - name: Remove browser test container
        if: always()
        run: docker rm -f portfolio-web 2>/dev/null || true
