version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
        update-types: [minor, patch]
      bundler:
        patterns: [vite, '@vitejs/plugin-react']
        update-types: [minor, patch]
      css:
        patterns: [tailwindcss, postcss, autoprefixer]
        update-types: [minor, patch]
      testing:
        patterns: ['@playwright/test', '@axe-core/playwright']
        update-types: [minor, patch]
      lint:
        patterns: [eslint, eslint-plugin-react-hooks]
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      openapi:
        patterns: ['Swashbuckle.*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
